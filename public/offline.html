<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;

        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #f97316;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 26px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #999;
        margin: 0 0 22px;
        font-size: 14px;
      }
      button {
        background: #f97316;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 26px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">PX</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تأكد من الاتصال وحاول مرة أخرى · You’re offline</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
